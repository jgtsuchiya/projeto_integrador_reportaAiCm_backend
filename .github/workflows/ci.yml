name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e testes unitários
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build

  integration:
    name: Testes de integração
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:9.7.2
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reportaai_cm_test
          MYSQL_USER: reportaai
          MYSQL_PASSWORD: reportaai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      supertokens-db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: supertokens
          POSTGRES_PASSWORD: supertokens
          POSTGRES_DB: supertokens
        options: >-
          --health-cmd="pg_isready -U supertokens -d supertokens"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      supertokens:
        image: supertokens/supertokens-postgresql:12.2.0
        env:
          POSTGRESQL_CONNECTION_URI: postgresql://supertokens:supertokens@supertokens-db:5432/supertokens
          API_KEYS: reportaai-ci-supertokens-api-key
          ACCESS_TOKEN_VALIDITY: 900
          REFRESH_TOKEN_VALIDITY: 10080
          PASSWORD_HASHING_ALG: ARGON2
        ports:
          - 3567:3567
        # Os services não têm depends_on: o Core encerra se o Postgres ainda não aceitar
        # conexões, e o restart o sobe de novo até conseguir.
        options: >-
          --restart=on-failure
          --health-cmd="curl -fs http://localhost:3567/hello"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="/mailpit readyz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: reportaai
      DB_PASSWORD: reportaai
      DB_DATABASE: reportaai_cm_test
      SUPERTOKENS_CONNECTION_URI: http://127.0.0.1:3567
      SUPERTOKENS_API_KEY: reportaai-ci-supertokens-api-key
      API_DOMAIN: http://localhost:3000
      WEB_APP_URL: http://localhost:5173
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAIL_FROM: 'ReportaAi Cm <no-reply@reportaai.local>'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      # Os e2e usam os mesmos serviços, por isso rodam neste job, que já é um check obrigatório.
      - run: npm run test:e2e
